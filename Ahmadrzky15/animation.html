<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Scene Animation</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: linear-gradient(180deg, #131862 0%, #1f4287 50%, #278ea5 100%);
      --ground: #113c57;
      --sun: #ffb347;
      --cloud: rgba(255, 255, 255, 0.9);
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: #fff;
    }

    .scene {
      position: relative;
      width: min(90vw, 480px);
      aspect-ratio: 4 / 3;
      background: radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.4), transparent 60%);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 45px rgba(12, 25, 64, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .ground {
      position: absolute;
      inset: 65% 0 0 0;
      background: linear-gradient(180deg, var(--ground) 0%, #0d253a 100%);
    }

    .sun {
      position: absolute;
      width: 120px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff5d6, var(--sun));
      top: 12%;
      right: 18%;
      animation: pulse 6s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(255, 180, 71, 0.75);
    }

    .cloud {
      position: absolute;
      top: 18%;
      background: var(--cloud);
      border-radius: 50px;
      height: 30px;
      width: 110px;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.15));
      animation: drift 14s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50px;
      width: 70px;
      height: 40px;
      top: -12px;
    }

    .cloud::before {
      left: 12px;
    }

    .cloud::after {
      right: 12px;
    }

    .cloud--left {
      left: -130px;
      animation-delay: -7s;
    }

    .cloud--right {
      left: 20px;
    }

    .balloon {
      position: absolute;
      width: 90px;
      aspect-ratio: 3 / 4;
      background: radial-gradient(circle at 30% 20%, #fff2ff, #bc13fe);
      border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
      top: 38%;
      left: 18%;
      animation: float 5.5s ease-in-out infinite;
      filter: drop-shadow(0 18px 24px rgba(29, 2, 61, 0.5));
    }

    .balloon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -28px;
      width: 2px;
      height: 34px;
      background: rgba(255, 255, 255, 0.75);
      transform: translateX(-50%);
    }

    .balloon::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -12px;
      width: 14px;
      height: 12px;
      background: linear-gradient(180deg, #bc13fe, #6f09a3);
      border-radius: 0 0 6px 6px;
      transform: translateX(-50%);
    }

    .mountain {
      position: absolute;
      bottom: 0;
      width: 60%;
      height: 55%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(31, 66, 135, 0.9));
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.45));
    }

    .mountain--left {
      left: -10%;
      transform: scale(0.9) translateY(6%);
      animation: fadeIn 1.5s ease forwards;
    }

    .mountain--right {
      right: -12%;
      transform: scale(1.1);
      animation: fadeIn 1.5s ease 0.3s forwards;
    }

    .shadow {
      position: absolute;
      bottom: 8%;
      left: 23%;
      width: 120px;
      height: 40px;
      background: radial-gradient(circle, var(--shadow), transparent 70%);
      transform: scaleX(0.8);
      animation: shadowPulse 5.5s ease-in-out infinite;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }
      50% {
        transform: translateY(-22px) rotate(3deg);
      }
    }

    @keyframes shadowPulse {
      0%,
      100% {
        transform: translateY(0) scale(0.8, 0.6);
        opacity: 0.4;
      }
      50% {
        transform: translateY(4px) scale(1, 0.65);
        opacity: 0.25;
      }
    }

    @keyframes drift {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(520px);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.08);
        filter: brightness(1.1);
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(10%) scale(0.9);
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main class="scene" role="img" aria-label="Balon ungu mengambang di atas pegunungan dengan matahari terbit.">
    <div class="sun"></div>
    <div class="cloud cloud--left"></div>
    <div class="cloud cloud--right"></div>
    <div class="mountain mountain--left"></div>
    <div class="mountain mountain--right"></div>
    <div class="balloon"></div>
    <div class="shadow"></div>
    <div class="ground"></div>
  </main>
</body>
</html>
